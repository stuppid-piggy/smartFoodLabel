<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能食物標簽</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";
        window.webllm = webllm; 
    </script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body>
    <div class="menu-container">
        <button onclick="toggleMenu()" class="menu-button">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </div>

    <div id="myDropdown" class="menu-dropdown">
        <div id="auth-menu-links">
            <a href="#login" onclick="toggleMenu()">登入</a>
            <a href="#register" onclick="toggleMenu()">注冊</a>
        </div>
    </div>

    <div id="home-view" class="view">
        <h1>智能食物標簽-你的健康助手</h1>
        <p>通過拍照識別食物成分表，快速了解食物的營養信息和健康建議。</p>
        <a href="#main" class="cta-btn">現在立即使用</a>
    </div>

    <div id="login-view" class="view">
        <div class="form-wrapper">
            <div class="form-card">
                <h2>用戶登入</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label>賬號</label>
                        <input type="text" id="login-username" required placeholder="請輸入您的賬號">
                    </div>
                    <div class="input-group">
                        <label>密碼</label>
                        <input type="password" id="login-password" required placeholder="請輸入您的密碼">
                    </div>
                    <button type="submit" class="submit-btn">立即登入</button>
                </form>
                <p style="text-align: center; margin-top: 15px;">
                    <a href="#" style="color: #2e7d32; text-decoration: none; font-size: 14px;">← 返回首頁</a>
                </p>
            </div>
        </div>
    </div>

    <div id="register-view" class="view">
        <div class="form-wrapper">
            <div class="form-card">
                <h2>新用戶注冊</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <label>設置賬號</label>
                        <input type="text" id="reg-username" required placeholder="請設置您的賬號">
                    </div>
                    <div class="input-group">
                        <label>設置密碼</label>
                        <input type="password" id="reg-password" required placeholder="請設置您的密碼">
                    </div>
                    <button type="submit" class="submit-btn">立即注冊</button>
                </form>
                <p style="text-align: center; margin-top: 15px;">
                    <a href="#" style="color: #2e7d32; text-decoration: none; font-size: 14px;">← 返回首頁</a>
                </p>
            </div>
        </div>
    </div>

    <div id="main-view" class="view">
        <div class="camera-container">
            <h2>食物標簽掃描儀</h2>
            <p>請允許瀏覽器使用您的攝像頭以掃描食物成分表。</p>
            <div class="video-wrap">
                <video id="camera-stream" autoplay playsinline style="width: 100%; max-width: 500px; border-radius: 12px;"></video>
            </div>

            <div class="camera-controls">
                <button onclick="startCamera()" class="submit-btn" style="background-color: #2e7d32;">開啟攝像頭</button>
                <button onclick="capturePhoto()" class="submit-btn" style="background-color: #388e3c;">拍照識別</button>
                <button onclick="stopCamera()" class="submit-btn" style="background-color: #d32f2f;">關閉攝像頭</button>
            </div>

            <div class="input-group" style="margin-top: 15px;">
                <label for="upload-photo-input" class="submit-btn" style="background-color: #2e7d32; color: white; cursor: pointer; display: inline-block; text-align: center;">
                    📁 上傳本地照片
                </label>
                <input type="file" id="upload-photo-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
            </div>

            <canvas id="snapshot-canvas" style="display:none;"></canvas>
            
            <div id="preview-container" style="margin-top: 15px; text-align: center;"></div>

            <p style="text-align: center; margin-top: 25px;">
                <a href="#" style="color: #2e7d32; text-decoration: none; font-size: 14px;">← 返回首頁</a>
            </p>
        </div>
    </div>
    

    <div id="answer-view" class="view">
        <div class="form-wrapper" style="text-align: left;">
            <h2>食物分析結果</h2>
            <div id="answer-content" style="line-height: 1.6; font-size: 16px; margin-bottom: 25px;">
                <p style="color: #666; text-align: center;">暫無分析結果，請先去拍照識別。</p>
            </div>
            <div style="text-align: center;">
                <a href="#main" class="submit-btn" style="text-decoration: none; display: inline-block;">返回主界面</a>
            </div>
        </div>
    </div>

    <div id="loading-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="spinner"></div>
            <h3 id="loading-title">加載中</h3>
            <p id="loading-message">正在處理，請稍候...</p>
        </div>
    </div>

    <div id="custom-alert-modal" class="modal-overlay">
        <div class="modal-card" style="text-align: center;">
            <h2 id="alert-title" style="color: #2e7d32; margin-top: 0; margin-bottom: 15px;">提示</h2>
            <p id="alert-message" style="color: #555; margin-bottom: 25px; line-height: 1.5;"></p>
            <button onclick="closeCustomAlert()" class="submit-btn">確定</button>
        </div>
    </div>

    <script src="sketch.js"></script>
    <div id="profile-view" class="view">
        <div class="card" style="text-align: left; max-width: 500px; margin: 40px auto;">
            <h2 style="color: #2e7d32; text-align: center; margin-top: 0;">👤 個人資料與偏好設置</h2>
            <form onsubmit="saveProfilePreference(event)">
                <div class="input-group">
                    <label>當前賬號</label>
                    <input type="text" id="profile-username" readonly style="background-color: #f0f0f0; color: #666;">
                </div>
                <div class="input-group">
                    <label>飲食習慣/忌口</label>
                    <input type="text" id="pref-diet" placeholder="例如：素食、低糖、無堅果">
                </div>
                <div class="input-group">
                    <label>健康目標</label>
                    <input type="text" id="pref-goal" placeholder="例如：減脂、增肌、控糖">
                </div>
                <button type="submit" class="submit-btn" style="margin-bottom: 10px;">保存修改</button>
                <button type="button" onclick="handleLogout()" class="cancel-btn" style="margin-bottom: 10px; background: linear-gradient(180deg, #e57373 0%, #d32f2f 100%) !important;">退出登入</button>
                <button type="button" onclick="window.location.hash='#main'" class="submit-btn" style="background: #78909c;">返回掃描儀</button>
            </form>
        </div>
    </div>
    <div style="position: absolute; top: 15px; right: 100px; z-index: 100;">
        <select id="lang-selector" onchange="changeLanguage(this.value)" style="padding: 6px 10px; border-radius: 6px; border: 1px solid #ccc; background: white; font-weight: bold; cursor: pointer;">
            <option value="tc">繁體中文</option>
            <option value="sc">简体中文</option>
            <option value="en">English</option>
        </select>
    </div>
</body>
</html>
