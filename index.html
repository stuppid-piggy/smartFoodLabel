<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能食物标签</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";
        window.webllm = webllm; // Make it globally accessible to sketch.js
    </script>
</head>
<body>

    <!-- Top-Right Menu Button -->
    <div class="menu-container">
        <button onclick="toggleMenu()" class="menu-button">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </div>

    <!-- Dropdown Menu with Hash Links -->
    <div id="myDropdown" class="menu-dropdown">
        <div id="auth-menu-links">
            <a href="#login" onclick="toggleMenu()">登入</a>
            <a href="#register" onclick="toggleMenu()">注册</a>
        </div>
    </div>

    <!-- ================= VIEW 1: HOME ================= -->
    <div id="home-view" class="view">
        <h1>智能食物标签-你的健康助手</h1>
        <p>通过拍照识别食物成分表，快速了解食物的营养信息和健康建议。</p>
        <a href="#main" class="cta-btn">现在立即使用</a>
    </div>

    <!-- ================= VIEW 2: LOGIN ================= -->
    <div id="login-view" class="view">
        <div class="form-wrapper">
            <div class="form-card">
                <h2>用户登入</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label>账号</label>
                        <input type="text" id="login-username" required placeholder="请输入您的账号">
                    </div>
                    <div class="input-group">
                        <label>密码</label>
                        <input type="password" id="login-password" required placeholder="请输入您的密码">
                    </div>
                    <button type="submit" class="submit-btn">立即登入</button>
                </form>
                <p style="text-align: center; margin-top: 15px;">
                    <a href="#" style="color: #2e7d32; text-decoration: none; font-size: 14px;">← 返回首页</a>
                </p>
            </div>
        </div>
    </div>

    <!-- ================= VIEW 3: REGISTER ================= -->
    <div id="register-view" class="view">
        <div class="form-wrapper">
            <div class="form-card">
                <h2>新用户注册</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <label>设置账号</label>
                        <input type="text" id="reg-username" required placeholder="请设置您的账号">
                    </div>
                    <div class="input-group">
                        <label>设置密码</label>
                        <input type="password" id="reg-password" required placeholder="请设置您的密码">
                    </div>
                    <button type="submit" class="submit-btn">立即注册</button>
                </form>
                <p style="text-align: center; margin-top: 15px;">
                    <a href="#" style="color: #2e7d32; text-decoration: none; font-size: 14px;">← 返回首页</a>
                </p>
            </div>
        </div>
    </div>

    <!-- ================= VIEW 4: MAIN / CAMERA ================= -->
    <div id="main-view" class="view">
        <div class="camera-container">
            <h2>食物标签扫描仪</h2>
            <p>请允许浏览器使用您的摄像头以扫描食物成分表。</p>
            
            <div class="video-wrap">
                <video id="camera-stream" autoplay playsinline></video>
            </div>

            <div class="camera-controls">
                <button onclick="startCamera()" class="submit-btn" style="background-color: #2e7d32;">开启摄像头</button>
                <button onclick="capturePhoto()" class="submit-btn" style="background-color: #388e3c;">拍照识别</button>
                <button onclick="stopCamera()" class="submit-btn" style="background-color: #d32f2f;">关闭摄像头</button>
            </div>

            <canvas id="snapshot-canvas" style="display:none;"></canvas>
            
            <div id="preview-container" style="margin-top: 15px; text-align: center;"></div>

            <p style="text-align: center; margin-top: 25px;">
                <a href="#" style="color: #2e7d32; text-decoration: none; font-size: 14px;">← 返回首页</a>
            </p>
        </div>
    </div>

    <!-- ================= VIEW 5: ANSWER PAGE ================= -->
    <div id="answer-view" class="view">
        <div class="form-wrapper" style="text-align: left;">
            <h2>食物分析结果</h2>
            <div id="answer-content" style="line-height: 1.6; font-size: 16px; margin-bottom: 25px;">
                <p style="color: #666; text-align: center;">暂无分析结果，请先去拍照识别。</p>
            </div>
            <div style="text-align: center;">
                <a href="#main" class="submit-btn" style="text-decoration: none; display: inline-block;">返回主界面</a>
            </div>
        </div>
    </div>

    <!-- ================= LOADING MODAL ================= -->
    <div id="loading-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="spinner"></div>
            <h3 id="loading-title">加载中</h3>
            <p id="loading-message">正在处理，请稍候...</p>
        </div>
    </div>

    <!-- ================= CUSTOM ALERT MODAL ================= -->
    <div id="custom-alert-modal" class="modal-overlay">
        <div class="modal-card" style="text-align: center;">
            <h2 id="alert-title" style="color: #2e7d32; margin-top: 0; margin-bottom: 15px;">提示</h2>
            <p id="alert-message" style="color: #555; margin-bottom: 25px; line-height: 1.5;"></p>
            <button onclick="closeCustomAlert()" class="submit-btn">确定</button>
        </div>
    </div>

    <script src="sketch.js"></script>
    <!-- ================= PROFILE VIEW ================= -->
    <div id="profile-view" class="view">
        <div class="card" style="text-align: left; max-width: 500px; margin: 40px auto;">
            <h2 style="color: #2e7d32; text-align: center; margin-top: 0;">👤 个人资料与偏好设置</h2>
            <form onsubmit="saveProfilePreference(event)">
                <div class="input-group">
                    <label>当前账号</label>
                    <input type="text" id="profile-username" readonly style="background-color: #f0f0f0; color: #666;">
                </div>
                <div class="input-group">
                    <label>饮食习惯/忌口</label>
                    <input type="text" id="pref-diet" placeholder="例如：素食、低糖、无坚果">
                </div>
                <div class="input-group">
                    <label>健康目标</label>
                    <input type="text" id="pref-goal" placeholder="例如：减脂、增肌、控糖">
                </div>
                <button type="submit" class="submit-btn" style="margin-bottom: 10px;">保存修改</button>
                <button type="button" onclick="handleLogout()" class="cancel-btn" style="margin-bottom: 10px; background: linear-gradient(180deg, #e57373 0%, #d32f2f 100%) !important;">退出登入</button>
                <button type="button" onclick="window.location.hash='#main'" class="submit-btn" style="background: #78909c;">返回扫描仪</button>
            </form>
        </div>
    </div>
</body>
</html>
